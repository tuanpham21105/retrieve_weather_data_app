spring.application.name=retrieve_weather_data_app

# Server
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:weatherdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenWeather API (replace with real key or set OPENWEATHER_API_KEY env variable)
openweathermap.api.key=${OPENWEATHER_API_KEY:your-api-key-here}
openweathermap.api.base-url=https://api.openweathermap.org/data/2.5

# JobRunr
org.jobrunr.dashboard.enabled=true
org.jobrunr.background-job-server.enabled=true
org.jobrunr.storage.dashboard.port=8080
