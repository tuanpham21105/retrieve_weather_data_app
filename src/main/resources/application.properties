spring.application.name=retrieve_weather_data_app

# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/demo_weather_app
spring.datasource.username=${db_username:devuser}
spring.datasource.password=${db_password:devpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OpenWeather API (replace with real key or set OPENWEATHER_API_KEY env variable)
openweathermap.api.key=${OPENWEATHER_API_KEY:your-api-key-here}
openweathermap.api.base-url=https://api.openweathermap.org/data/2.5

# JobRunr
jobrunr.dashboard.enabled=true
jobrunr.background-job-server.enabled=true
jobrunr.dashboard.port=8000
